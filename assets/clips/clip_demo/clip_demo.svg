<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0d0d0d"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#grad)" opacity="0.5"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <!-- Stars -->
  <circle cx="100" cy="80"  r="2" fill="white" opacity="0.6"/>
  <circle cx="250" cy="40"  r="1" fill="white" opacity="0.5"/>
  <circle cx="600" cy="60"  r="2" fill="white" opacity="0.7"/>
  <circle cx="720" cy="100" r="1" fill="white" opacity="0.4"/>
  <circle cx="400" cy="30"  r="1.5" fill="white" opacity="0.6"/>
  <circle cx="50"  cy="200" r="1" fill="white" opacity="0.5"/>
  <circle cx="750" cy="200" r="2" fill="white" opacity="0.6"/>
  <!-- Aura glow -->
  <ellipse cx="400" cy="280" rx="180" ry="120" fill="#f5a623" opacity="0.08"/>
  <ellipse cx="400" cy="280" rx="120" ry="80"  fill="#f5a623" opacity="0.06"/>
  <!-- Silhouette Goku -->
  <g transform="translate(280,160)" fill="#111">
    <ellipse cx="30" cy="0" rx="20" ry="22"/>  <!-- head -->
    <!-- hair spikes -->
    <polygon points="10,-15 18,-40 26,-18" fill="#111"/>
    <polygon points="22,-18 32,-45 40,-20" fill="#111"/>
    <polygon points="36,-16 46,-42 52,-14" fill="#111"/>
    <rect x="10" y="22" width="40" height="60" rx="5"/> <!-- body -->
    <rect x="-5" y="28" width="16" height="45" rx="4" transform="rotate(-10,4,50)"/> <!-- left arm -->
    <rect x="50" y="28" width="16" height="45" rx="4" transform="rotate(15,60,50)"/> <!-- right arm -->
    <rect x="10" y="80" width="18" height="55" rx="4"/> <!-- left leg -->
    <rect x="32" y="80" width="18" height="55" rx="4"/> <!-- right leg -->
  </g>
  <!-- Silhouette Vegeta -->
  <g transform="translate(450,165)" fill="#111">
    <ellipse cx="30" cy="0" rx="18" ry="20"/>  <!-- head -->
    <!-- vegeta hair spikes (pointed up) -->
    <polygon points="12,-18 22,-50 30,-20" fill="#111"/>
    <polygon points="26,-20 35,-52 44,-18" fill="#111"/>
    <!-- armor outline -->
    <rect x="8" y="20" width="44" height="58" rx="3"/> <!-- torso -->
    <rect x="-6" y="26" width="15" height="42" rx="4" transform="rotate(-8,2,47)"/>
    <rect x="52" y="26" width="15" height="42" rx="4" transform="rotate(8,60,47)"/>
    <rect x="10" y="76" width="17" height="52" rx="4"/>
    <rect x="31" y="76" width="17" height="52" rx="4"/>
    <!-- armor chest plates -->
    <rect x="10" y="22" width="44" height="30" rx="3" fill="#222"/>
  </g>
  <!-- Aura lines -->
  <line x1="310" y1="400" x2="290" y2="160" stroke="#f5a623" stroke-width="1.5" opacity="0.3"/>
  <line x1="350" y1="420" x2="340" y2="160" stroke="#f5a623" stroke-width="1" opacity="0.2"/>
  <line x1="480" y1="400" x2="490" y2="160" stroke="#f5a623" stroke-width="1.5" opacity="0.3"/>
  <!-- Title -->
  <text x="400" y="420" font-family="sans-serif" font-size="22" font-weight="bold" fill="#e94560" text-anchor="middle">Dragon Ball Z</text>
  <text x="400" y="445" font-family="sans-serif" font-size="13" fill="#888" text-anchor="middle">L'Allenamento Leggendario (Demo)</text>
</svg>
